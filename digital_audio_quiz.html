        options: ["부스트 대신 3kHz 주변 불필요 대역을 좁게 Cut하고, 보완적으로 다른 트랙의 경쟁 주파수를 낮춘다", "컴프레서를 추가로 걸어 전체 레벨을 낮춘다", "샘플링 레이트를 높여 고역 표현을 개선한다", "스테레오 채널을 모노로 합쳐 위상을 정리한다"],
        answer: 0, emoji: "👂", tag: "실무",
        explanation: "【실무 포인트】 특정 대역 과도 부스트는 청각 피로(Ear Fatigue)를 유발한다. 전문가 접근법: ① 'Subtractive EQ First' — 경쟁 트랙의 3kHz를 살짝 Cut해 보컬 공간을 만든다 ② 보컬 자체는 최소한의 부스트로 유지 ③ 다이나믹 EQ나 멀티밴드 컴프를 사용해 보컬 레벨에 따라 EQ양이 자동 조절되도록 설정.",
      },
      {
        id: 17,
        question: "【실무】 믹스에 컴프레서를 걸었더니 드럼의 킥과 스네어 타격감이 사라지고 소리가 뭉개졌다. 파라미터 조정 순서로 가장 올바른 대처는?",
        options: ["Ratio를 높이고 Threshold를 낮춰 더 강하게 압축한다", "Attack을 느리게(20~50ms) 조정해 트랜지언트가 컴프 작동 전에 통과되도록 하고, Release를 킥 리듬에 맞춰 조정한다", "Make-up Gain을 높여 레벨을 보상하면 타격감이 돌아온다", "모노 버스에 컴프를 걸지 않고 스테레오 링크를 해제한다"],
        answer: 1, emoji: "🥊", tag: "실무",
        explanation: "【실무 포인트】 드럼 컴프레싱에서 타격감(Punch) 소실의 원인은 대부분 Attack이 너무 빠른 것이다. 해결 원리: Attack을 느리게 → 트랜지언트는 통과 → 이후 서스테인 부분만 압축 → 킥·스네어가 앞으로 튀어나오는 느낌. Release는 다음 킥이 오기 전에 게인이 완전히 복원될 수 있도록 BPM 기반으로 계산한다(60,000ms ÷ BPM).",
      },
      {
        id: 18,
        question: "【실무】 마스터링 단계에서 리미터를 걸었더니 전체 레벨은 올라갔지만 저음이 펌핑되며 들썩이는 현상이 나타났다. 원인과 대처법은?",
        options: ["리미터의 Ceiling을 0dBFS로 설정해야 하는데 낮게 설정해서 생긴 오류다", "킥 등 저역 트랜지언트가 리미터를 과도하게 트리거해 전체 레벨이 들썩이는 것이며, 리미터 전단에 멀티밴드 처리나 저역 트랜지언트 제어가 필요하다", "스테레오 파일을 모노 호환 설정 없이 리미팅했기 때문이다", "샘플링 레이트가 44.1kHz일 때 리미터 알고리즘이 저역을 정확히 감지하지 못한다"],
        answer: 1, emoji: "🎚️", tag: "실무",
        explanation: "【실무 포인트】 킥·베이스의 강한 저역 트랜지언트는 브로드밴드 리미터를 과도하게 트리거한다. 대처법: ① 리미터 전단에 멀티밴드 컴프로 저역만 별도 제어 ② 킥 채널에 트랜지언트 셰이퍼로 어택 피크를 줄임 ③ True Peak 리미터(-1 dBTP)와 브로드밴드 리미터를 직렬 사용 ④ LUFS 타깃보다 음악적 다이나믹을 우선시.",
      },
      {
        id: 19,
        question: "【실무】 영상 후반작업(Post-Production)을 위해 음악을 납품할 때 음악 파일의 샘플링 레이트를 48kHz로 요청받았다. 기존 44.1kHz 마스터를 변환할 때 반드시 주의해야 할 점은?",
        options: ["48kHz는 44.1kHz보다 샘플 수가 많으므로 변환 없이 그냥 파일 헤더만 수정하면 된다", "고품질 SRC(Sample Rate Conversion) 알고리즘을 사용해야 하며, 저품질 변환 시 앨리어싱 성분이 추가되거나 고역이 손실될 수 있다", "48kHz 변환 시 반드시 비트 뎁스도 32비트로 올려야 한다", "44.1kHz를 48kHz로 올리면 자동으로 음질이 향상된다"],
        answer: 1, emoji: "🎬", tag: "실무",
        explanation: "【실무 포인트】 샘플레이트 컨버전은 단순한 포맷 변경이 아니라 디지털 필터링과 보간(Interpolation)을 포함한 복잡한 DSP 연산이다. 저품질 SRC는 고역 롤오프, 앨리어싱 성분 추가, 위상 왜곡을 유발한다. 실무 기준: iZotope RX, r8brain 등 검증된 알고리즘 사용. 영상 프로젝트는 처음부터 48kHz로 작업하는 것이 최선이다.",
      },
      {
        id: 20,
        question: "【실무】 스트리밍 플랫폼 납품용 마스터링에서 True Peak 제한을 -1 dBTP로 설정하는 이유는?",
        options: ["저작권 보호 규격이 -1 dBTP를 의무화하고 있기 때문이다", "MP3·AAC 등 손실 압축 인코딩 과정에서 Inter-Sample Peak이 0dBFS를 초과해 클리핑이 발생할 수 있기 때문이다", "스트리밍 서버의 라우드니스 노멀라이제이션이 -1 dBTP 이상 신호를 삭제하기 때문이다", "True Peak와 Sample Peak의 차이가 항상 1dB이기 때문에 관습적으로 사용한다"],
        answer: 1, emoji: "📡", tag: "실무",
        explanation: "【실무 포인트】 Inter-Sample Peak(ISP)는 샘플 사이의 실제 아날로그 파형이 개별 샘플값보다 높을 수 있는 현상이다. PCM에서 0dBFS에 딱 맞게 납품해도 MP3/AAC 인코딩 후 디코딩 시 ISP가 최대 3dB 이상 초과할 수 있다. True Peak 미터(ITU-R BS.1770-4)는 4배 오버샘플링으로 ISP를 감지하므로, -1 dBTP 제한은 인코딩 마진을 확보하는 업계 표준 관행이다.",
      },
    ];

    function App() {
      const [current, setCurrent] = useState(0);
      const [selected, setSelected] = useState(null);
      const [score, setScore] = useState(0);
      const [showResult, setShowResult] = useState(false);
      const [answered, setAnswered] = useState(false);
      const [wrongAnswers, setWrongAnswers] = useState([]);

      const total = questions.length;
      const q = questions[current];
      const isPractical = q?.tag === "실무";

      const handleSelect = (idx) => {
        if (answered) return;
        setSelected(idx);
        setAnswered(true);
        if (idx === q.answer) setScore(s => s + 1);
        else setWrongAnswers(prev => [...prev, current]);
      };

      const handleNext = () => {
        if (current + 1 >= total) setShowResult(true);
        else { setCurrent(c => c + 1); setSelected(null); setAnswered(false); }
      };

      const handleRestart = () => {
        setCurrent(0); setSelected(null); setScore(0);
        setShowResult(false); setAnswered(false); setWrongAnswers([]);
      };

      const theoryWrong = wrongAnswers.filter(i => questions[i].tag !== "실무");
      const practicalWrong = wrongAnswers.filter(i => questions[i].tag === "실무");
      const theoryScore = 10 - theoryWrong.length;
      const practicalScore = 10 - practicalWrong.length;

      const getGrade = () => {
        const pct = score / total;
        if (pct === 1)  return { label: "🏆 만점! 이론과 실무 모두 완벽합니다", color: "#FFD700" };
        if (pct >= 0.8) return { label: "🥇 우수 — 현장 투입 가능한 수준", color: "#e6b800" };
        if (pct >= 0.6) return { label: "🥈 양호 — 실무 트러블슈팅 보완 필요", color: "#aaa" };
        if (pct >= 0.4) return { label: "🥉 미흡 — 이론·실무 전반 재학습 권장", color: "#CD7F32" };
        return { label: "📚 기초부터 체계적으로 재학습을 권장합니다", color: "#e74c3c" };
      };

      const grade = getGrade();

      const app = { minHeight:"100vh", background:"linear-gradient(135deg,#0f0c29,#302b63,#24243e)", display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" };
      const card = { background:"rgba(255,255,255,0.06)", backdropFilter:"blur(20px)", border:"1px solid rgba(255,255,255,0.15)", borderRadius:"28px", padding:"36px 32px", maxWidth:"660px", width:"100%", boxShadow:"0 25px 80px rgba(0,0,0,0.5)", color:"#fff" };

      if (showResult) {
        return (
          <div style={app}>
            <div style={card}>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:"1.8rem",marginBottom:"6px"}}>📊 최종 결과</div>
                <div style={{fontSize:"4.5rem",fontWeight:900,color:grade.color,lineHeight:1,marginBottom:"6px"}}>{score} / {total}</div>
                <div style={{fontSize:"1.1rem",fontWeight:700,marginBottom:"20px",color:"#e2e8f0"}}>{grade.label}</div>

                <div style={{display:"flex",gap:"12px",justifyContent:"center",marginBottom:"20px"}}>
                  {[["🎓 이론 파트", theoryScore, "#a78bfa"], ["🛠 실무 파트", practicalScore, "#fb923c"]].map(([label, s, color]) => (
                    <div key={label} style={{flex:1,background:"rgba(255,255,255,0.06)",border:`1px solid ${color}44`,borderRadius:"14px",padding:"14px",textAlign:"center"}}>
                      <div style={{fontSize:"0.75rem",color,fontWeight:700,marginBottom:"6px"}}>{label}</div>
                      <div style={{fontSize:"2rem",fontWeight:900,color:s>=7?"#4ade80":"#f87171"}}>{s}/10</div>
                    </div>
                  ))}
                </div>

                <div style={{display:"flex",justifyContent:"center",gap:"5px",flexWrap:"wrap",marginBottom:"16px"}}>
                  {questions.map((_, i) => <span key={i} style={{fontSize:"1.2rem"}}>{wrongAnswers.includes(i)?"❌":"✅"}</span>)}
                </div>

                {wrongAnswers.length > 0 && (
                  <div style={{textAlign:"left",background:"rgba(248,113,113,0.08)",border:"1px solid rgba(248,113,113,0.25)",borderRadius:"14px",padding:"16px 18px",maxHeight:"300px",overflowY:"auto",marginBottom:"16px"}}>
                    <div style={{color:"#f87171",fontWeight:700,marginBottom:"10px",fontSize:"0.9rem"}}>📝 오답 노트 ({wrongAnswers.length}문제)</div>
                    {wrongAnswers.map(wi => (
                      <div key={wi} style={{fontSize:"0.84rem",color:"#fca5a5",marginBottom:"10px",lineHeight:1.55,borderBottom:"1px solid rgba(255,255,255,0.07)",paddingBottom:"8px"}}>
                        <span style={{fontSize:"0.7rem",fontWeight:700,padding:"1px 7px",borderRadius:"10px",marginRight:"6px",background:questions[wi].tag==="실무"?"rgba(251,146,60,0.2)":"rgba(167,139,250,0.2)",color:questions[wi].tag==="실무"?"#fb923c":"#c4b5fd"}}>{questions[wi].tag||"이론"}</span>
                        <strong>Q{wi+1}.</strong> {questions[wi].question}<br/>
                        <span style={{color:"#86efac"}}>✔ 정답: {questions[wi].options[questions[wi].answer]}</span>
                      </div>
                    ))}
                  </div>
                )}

                <button onClick={handleRestart} style={{width:"100%",padding:"14px",borderRadius:"13px",background:"linear-gradient(135deg,#059669,#34d399)",border:"none",color:"#fff",fontSize:"1rem",fontWeight:700,cursor:"pointer"}}>
                  🔄 처음부터 다시
                </button>
              </div>
            </div>
          </div>
        );
      }

      const optionStyle = (idx) => {
        let bg = "rgba(255,255,255,0.07)", border = "1px solid rgba(255,255,255,0.15)", color = "#e2e8f0";
        if (answered) {
          if (idx === q.answer) { bg="rgba(74,222,128,0.2)"; border="1.5px solid #4ade80"; color="#4ade80"; }
          else if (idx === selected) { bg="rgba(248,113,113,0.2)"; border="1.5px solid #f87171"; color="#f87171"; }
        }
        return { background:bg, border, color, borderRadius:"13px", padding:"13px 16px", textAlign:"left", fontSize:"0.93rem", cursor:answered?"default":"pointer", transition:"all 0.2s", fontWeight:answered&&idx===q.answer?700:400, lineHeight:1.5, width:"100%", display:"block", marginBottom:"10px" };
      };

      return (
        <div style={app}>
          <div style={card}>
            <div style={{textAlign:"center",marginBottom:"24px"}}>
              <div style={{fontSize:"1rem",color:"#a78bfa",letterSpacing:"0.12em",textTransform:"uppercase",fontWeight:700,marginBottom:"8px"}}>🎵 디지털 오디오 이론 — 심화 퀴즈</div>
              <span style={{display:"inline-block",padding:"3px 12px",borderRadius:"20px",fontSize:"0.78rem",fontWeight:700,background:isPractical?"rgba(251,146,60,0.2)":"rgba(167,139,250,0.2)",border:isPractical?"1px solid #fb923c":"1px solid #a78bfa",color:isPractical?"#fb923c":"#c4b5fd",marginBottom:"8px"}}>
                {isPractical ? "🛠 실무 트러블슈팅" : "🎓 이론"}
              </span>
              <div style={{color:"rgba(255,255,255,0.45)",fontSize:"0.82rem",marginBottom:"12px"}}>{current+1} / {total} 문제 · 현재 점수 {score}점</div>
              <div style={{display:"flex",gap:"4px",justifyContent:"center",flexWrap:"wrap",marginBottom:"4px"}}>
                {questions.map((qq, i) => (
                  <div key={i} style={{width:"22px",height:"5px",borderRadius:"3px",background: i<current?(qq.tag==="실무"?"#fb923c":"#a78bfa"):i===current?"#fff":"rgba(255,255,255,0.15)",transition:"background 0.3s"}} />
                ))}
              </div>
              <div style={{display:"flex",justifyContent:"center",gap:"16px",fontSize:"0.72rem",color:"rgba(255,255,255,0.4)",marginTop:"4px"}}>
                <span>■ <span style={{color:"#a78bfa"}}>이론</span> Q1~10</span>
                <span>■ <span style={{color:"#fb923c"}}>실무</span> Q11~20</span>
              </div>
            </div>

            <div style={{fontSize:"3rem",textAlign:"center",marginBottom:"10px"}}>{q.emoji}</div>
            <div style={{fontSize:"1.08rem",fontWeight:600,lineHeight:1.65,textAlign:"center",marginBottom:"24px",color:"#f0f0ff"}}>{q.question}</div>

            <div>
              {q.options.map((opt, idx) => (
                <button key={idx} style={optionStyle(idx)} onClick={() => handleSelect(idx)}>
                  <span style={{opacity:0.45,marginRight:"10px"}}>{["①","②","③","④"][idx]}</span>{opt}
                </button>
              ))}
            </div>

            {answered && (
              <div style={{marginTop:"16px",padding:"15px",background:isPractical?"rgba(251,146,60,0.1)":"rgba(167,139,250,0.12)",border:isPractical?"1px solid rgba(251,146,60,0.35)":"1px solid rgba(167,139,250,0.35)",borderRadius:"13px",fontSize:"0.88rem",color:"#e2e8f0",lineHeight:1.7}}>
                {selected===q.answer?"✅ 정답  ":"❌ 오답  "}{q.explanation}
              </div>
            )}

            {answered && (
              <button onClick={handleNext} style={{marginTop:"18px",width:"100%",padding:"14px",borderRadius:"13px",background:isPractical?"linear-gradient(135deg,#c2410c,#fb923c)":"linear-gradient(135deg,#7c3aed,#a78bfa)",border:"none",color:"#fff",fontSize:"1rem",fontWeight:700,cursor:"pointer"}}>
                {current+1>=total?"📊 결과 보기":"다음 문제 →"}
              </button>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
